<!-- rental/templates/login.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-6 text-center">Log in to your account</h2>
    
    <form method="POST">
      {% csrf_token %}
      <div class="mb-4">
        <label class="block mb-1 font-semibold">Username</label>
        <input type="text" name="username" required
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <div class="mb-6">
        <label class="block mb-1 font-semibold">Password</label>
        <input type="password" name="password" required
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <button type="submit"
              class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition">
        Login
      </button>
    </form>

    <div class="text-center mt-4">
      <a href="#" class="text-sm text-blue-500 hover:underline">Forgot password?</a><br>
      <a href="{% url 'register' %}" class="text-sm text-blue-500 hover:underline">Don't have an account? Register</a>
    </div>
  </div>
</body>
</html>
